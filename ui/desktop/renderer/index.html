<!doctype html>
<!-- index.html — 화면의 뼈대. Vite 의 진입점.
     실제 UI 는 전부 React 가 <div id="root"> 안에 그린다.
     아래 script(type=module)가 React 앱(src/main.jsx)을 불러온다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Unreal Tester</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- React 가 여기에 화면을 심는다 -->
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
